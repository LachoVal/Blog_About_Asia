<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="profileModalLabel" data-i18n="profileModalTitle">Update Profile Avatar</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" data-i18n-aria-label="close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex flex-column gap-2">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <button type="button" class="btn btn-outline-secondary" id="avatarBrowseBtn" data-i18n="chooseFile">Choose File</button>
            <span id="avatarFileName" class="text-muted small" data-i18n="noFileChosen">No file chosen</span>
          </div>
          <input type="file" id="avatarInput" accept="image/*" class="d-none">
        </div>
        <div id="avatarFeedback" class="mt-2 small"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-danger me-auto" id="clearAvatarBtn" data-i18n="clear">Clear</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveAvatarBtn" data-i18n="uploadSave">Upload &amp; Save</button>
      </div>
    </div>
  </div>
</div>
